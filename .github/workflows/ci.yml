name: CI

on:
    workflow_dispatch:
        inputs:
            runner:
                description: 'Runner environment to execute on'
                required: false
                default: 'self-hosted'
                type: choice
                options:
                    - self-hosted
                    - github-hosted
    pull_request:
        branches: [master]
    push:
        branches: [master]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Until now nothing type-checked this package on a PR — the first thing to
    # compile it was `publish.yml`, which only runs on a published release. A
    # broken build therefore surfaced at release time instead of at review
    # time, in the package every app's auth path goes through.
    build:
        name: Build + typecheck
        runs-on: ${{ (inputs.runner == 'github-hosted' || vars.CI_RUNNER == 'github-hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "node"]') }}
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # registry-url + scope make setup-node write the ~/.npmrc that
            # points @system-b90/* at GitHub Packages and reads NODE_AUTH_TOKEN
            # — without it `npm ci` 401s on the @system-b90/hive-core dep.
            # Same wiring publish.yml uses.
            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  registry-url: https://npm.pkg.github.com
                  scope: "@system-b90"
                  cache: npm

            - name: Install dependencies
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build
              run: npm run build

            # `npm run build` emits declarations; --noEmit re-checks without
            # writing, so a stale dist/ can't mask a type error.
            - name: Typecheck
              run: npx tsc -p tsconfig.json --noEmit

            # The suite asserts against dist/, so it needs the build above.
            # Nothing ran it on a PR until now: the callbacks every app's auth
            # path goes through could regress and still merge green.
            - name: Test
              run: npm test
